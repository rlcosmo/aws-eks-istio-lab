name: AWS EKS Istio Lab - CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/orders-api/requirements.txt
            src/orders-api/requirements-dev.txt
            src/orders-worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/orders-api/requirements.txt
          pip install -r src/orders-api/requirements-dev.txt
          pip install -r src/orders-worker/requirements.txt
          pip install pyyaml

      - name: Run unit tests
        run: |
          PYTHONPATH=src/orders-api:src/orders-worker/app pytest -v tests/

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        run: terraform -chdir=terraform/persistent fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=terraform/persistent init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/persistent validate

  yaml:
    name: Kubernetes YAML Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: pip install pyyaml

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = list(Path("kubernetes").rglob("*.yaml"))

          if not files:
              raise SystemExit("No Kubernetes YAML files found")

          for file in files:
              with file.open() as stream:
                  list(yaml.safe_load_all(stream))
              print(f"OK: {file}")
          PY

  versions:
    name: Validate Semantic Versions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate microservice versions
        shell: bash
        run: |
          set -euo pipefail

          for service in orders-api orders-worker; do
            VERSION=$(tr -d '[:space:]' < "src/${service}/VERSION")

            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Invalid SemVer for ${service}: ${VERSION}"
              exit 1
            fi

            echo "${service}: ${VERSION}"
          done

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-24.04
    needs:
      - versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read versions
        run: |
          echo "API_VERSION=$(cat src/orders-api/VERSION)" >> "$GITHUB_ENV"
          echo "WORKER_VERSION=$(cat src/orders-worker/VERSION)" >> "$GITHUB_ENV"

      - name: Build Orders API image
        run: |
          docker build \
            -t aws-eks-istio-lab-orders-api:${API_VERSION} \
            -t aws-eks-istio-lab-orders-api:${GITHUB_SHA} \
            ./src/orders-api

      - name: Build Orders Worker image
        run: |
          docker build \
            -t aws-eks-istio-lab-orders-worker:${WORKER_VERSION} \
            -t aws-eks-istio-lab-orders-worker:${GITHUB_SHA} \
            ./src/orders-worker

      - name: List generated images
        run: docker images aws-eks-istio-lab-orders-*

  publish-ecr:
    name: Publish Images to Amazon ECR
    runs-on: ubuntu-24.04
    needs:
      - tests
      - terraform
      - yaml
      - versions
      - docker-build

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_TO_ASSUME != '' &&
      vars.AWS_REGION != ''

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read versions
        run: |
          echo "API_VERSION=$(cat src/orders-api/VERSION)" >> "$GITHUB_ENV"
          echo "WORKER_VERSION=$(cat src/orders-worker/VERSION)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Orders API
        uses: docker/build-push-action@v6
        with:
          context: ./src/orders-api
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/aws-eks-istio-lab-dev-orders-api:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/aws-eks-istio-lab-dev-orders-api:${{ env.API_VERSION }}
          labels: |
            org.opencontainers.image.title=orders-api
            org.opencontainers.image.version=${{ env.API_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Orders Worker
        uses: docker/build-push-action@v6
        with:
          context: ./src/orders-worker
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/aws-eks-istio-lab-dev-orders-worker:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/aws-eks-istio-lab-dev-orders-worker:${{ env.WORKER_VERSION }}
          labels: |
            org.opencontainers.image.title=orders-worker
            org.opencontainers.image.version=${{ env.WORKER_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
