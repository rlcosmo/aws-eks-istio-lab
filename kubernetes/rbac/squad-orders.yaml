apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squad-orders-operator
  namespace: orders-api
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      - pods
      - pods/log
      - pods/exec
      - deployments
      - replicasets
      - services
      - configmaps
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squad-orders-binding
  namespace: orders-api
subjects:
  - kind: Group
    name: squad-orders
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: squad-orders-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squad-orders-operator
  namespace: orders-worker
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      - pods
      - pods/log
      - pods/exec
      - deployments
      - replicasets
      - services
      - configmaps
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squad-orders-binding
  namespace: orders-worker
subjects:
  - kind: Group
    name: squad-orders
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: squad-orders-operator
  apiGroup: rbac.authorization.k8s.io
